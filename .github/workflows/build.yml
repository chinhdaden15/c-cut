# Build bộ cài C-Cut cho 3 loại máy. Chạy tay (Actions › build › Run workflow) hoặc khi đẩy tag v*.
name: build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15-intel, arch: intel, ff: amd64}
          - {runner: macos-14, arch: arm64, ff: arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: "requirements.lock.txt"}
      - name: ffmpeg tĩnh (bản ghim ở release tools-ffmpeg-1 — không phụ thuộc trang ngoài)
        run: |
          mkdir -p build/ffmpeg && cd build/ffmpeg
          curl -fsSL --retry 3 -o ff.zip "https://github.com/chinhdaden15/c-cut/releases/download/tools-ffmpeg-1/ffmpeg-mac-${{ matrix.arch }}.zip"
          unzip -o ff.zip && rm ff.zip && chmod +x ffmpeg ffprobe
          ./ffmpeg -hide_banner -filters | grep -E "zscale|loudnorm|ebur128"
      - uses: actions/cache@v4             # model chép lời / giọng đọc / Node của lần trước → không tải lại, tránh bị giới hạn lượt
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/hyperframes
            assets/icons3d/3dicons
            assets/icons3d/fluent
          key: models-mac-${{ matrix.arch }}-v2
      - run: pip install -r packaging/requirements-build.txt
      - run: pip install --no-deps vieneu==3.2.1
      - run: FFMPEG_DIR=build/ffmpeg PY=python ./packaging/build_mac.sh
      - name: kiểm tra bản đóng gói
        env: {PYTHONUTF8: "0", CCUT_HOME: build/res/seed}
        run: build/pyi/C-Cut.app/Contents/MacOS/ccut-py packaging/smoke.py
      - name: kiểm tra lệnh python Claude gọi (-m thagent.tools)
        env: {PYTHONUTF8: "0", CCUT_HOME: build/res/seed}
        run: build/pyi/C-Cut.app/Contents/MacOS/ccut-py -m thagent.tools | grep -q "thagent.tools where" && echo TOOLS OK
      - name: kiểm tra lệnh Voice to Motion (-m thagent.v2m — gói, chạy __main__)
        env: {PYTHONUTF8: "0", CCUT_HOME: build/res/seed}
        run: build/pyi/C-Cut.app/Contents/MacOS/ccut-py -u -m thagent.v2m | grep -q "Voice to Motion" && echo V2M OK
      - name: kiểm tra lệnh Review Editor (-m thagent.review)
        env: {PYTHONUTF8: "0", CCUT_HOME: build/res/seed}
        run: build/pyi/C-Cut.app/Contents/MacOS/ccut-py -m thagent.review | grep -q "Review Editor" && echo REVIEW OK
      - name: kiểm tra lệnh HyperFrames dùng chung (-m thagent.hyper, -m thagent.capabilities)
        env: {PYTHONUTF8: "0", CCUT_HOME: build/res/seed}
        run: build/pyi/C-Cut.app/Contents/MacOS/ccut-py -m thagent.hyper | grep -q "HyperFrames" && echo HYPER OK
      - name: e2e mọi skill trên BẢN ĐÓNG GÓI (lỗi → không xuất bản cài)
        env: {PYTHONUTF8: "0", CCUT_ASR_MODEL: small, CCUT_TEST_SIGNING_KEY: "${{ secrets.CCUT_TEST_SIGNING_KEY }}"}   # ký mã bản quyền thử cho bài dựng skill bán
        run: |
          export PATH="$PWD/build/ffmpeg:$PATH" CCUT_HOME="$PWD/e2e_home"   # thư mục dữ liệu MỚI như máy vừa cài
          PY=build/pyi/C-Cut.app/Contents/MacOS/ccut-py
          $PY -c "import os; from pathlib import Path; from thagent.app_main import seed, res_dir; seed(res_dir(), Path(os.environ['CCUT_HOME']))"
          $PY -c "import sys; from thagent.hyper.autoinstall import run; d = run(force_portable_node=True); print(d); sys.exit(0 if d['ok'] else 1)"   # tự cài như lúc mở app (tự tải Node portable)
          $PY packaging/e2e.py e2e_frozen --only common,hyper,review
      - uses: actions/upload-artifact@v4
        with: {name: "C-Cut-mac-${{ matrix.arch }}", path: "dist/C-Cut-mac-*.dmg"}
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: "requirements.lock.txt"}
      - run: pip install -r packaging/requirements-build.txt
      - run: pip install --no-deps vieneu==3.2.1
      - run: choco install innosetup -y --no-progress
      - name: ffmpeg tĩnh (bản ghim)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\ffmpeg | Out-Null
          Invoke-WebRequest "https://github.com/chinhdaden15/c-cut/releases/download/tools-ffmpeg-1/ffmpeg-win64.zip" -OutFile build\ffw.zip
          Expand-Archive build\ffw.zip -DestinationPath build\ffmpeg -Force; Remove-Item build\ffw.zip
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/hyperframes
            assets/icons3d/3dicons
            assets/icons3d/fluent
          key: models-win-v2
      - run: ./packaging/build_win.ps1
        shell: pwsh
      - name: kiểm tra bản đóng gói
        env: {PYTHONUTF8: "0", PYTHONIOENCODING: "", CCUT_HOME: build/res/seed}
        run: build\pyi\C-Cut\ccut-py.exe packaging\smoke.py
        shell: pwsh
      - name: kiểm tra lệnh python Claude gọi qua Git Bash (giống app)
        shell: bash
        env: {PYTHONUTF8: "0", PYTHONIOENCODING: ""}
        run: |
          H=$(mktemp -d); mkdir -p "$H/.venv/bin"
          EXE=$(cygpath -m "$PWD/build/pyi/C-Cut/ccut-py.exe")
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$EXE" > "$H/.venv/bin/python"; chmod +x "$H/.venv/bin/python"
          export CCUT_HOME=$(cygpath -m "$PWD/build/res/seed") PYTHONPATH=$(cygpath -m "$H")
          cd "$H" && .venv/bin/python -m thagent.tools | grep -q "thagent.tools where" && echo SHIM OK
          .venv/bin/python -u -m thagent.v2m | grep -q "Voice to Motion" && echo V2M OK
          .venv/bin/python -m thagent.review | grep -q "Review Editor" && echo REVIEW OK
          .venv/bin/python -m thagent.hyper | grep -q "HyperFrames" && echo HYPER OK
      - name: e2e mọi skill trên BẢN ĐÓNG GÓI Windows, bảng mã mặc định (lỗi → không xuất bản cài)
        env: {PYTHONUTF8: "0", PYTHONIOENCODING: "", CCUT_ASR_MODEL: small, CCUT_TEST_SIGNING_KEY: "${{ secrets.CCUT_TEST_SIGNING_KEY }}"}
        shell: pwsh
        run: |
          $env:PATH = "$PWD\build\ffmpeg;$env:PATH"
          $env:CCUT_HOME = "$PWD\e2e_home"     # thư mục dữ liệu MỚI như máy vừa cài
          build\pyi\C-Cut\ccut-py.exe -c "import os; from pathlib import Path; from thagent.app_main import seed, res_dir; seed(res_dir(), Path(os.environ['CCUT_HOME']))"; if ($LASTEXITCODE) { exit 1 }
          build\pyi\C-Cut\ccut-py.exe -c "import sys; from thagent.hyper.autoinstall import run; d = run(force_portable_node=True); print(d); sys.exit(0 if d['ok'] else 1)"; if ($LASTEXITCODE) { exit 1 }
          build\pyi\C-Cut\ccut-py.exe packaging\e2e.py e2e_frozen --only common,hyper,review; if ($LASTEXITCODE) { exit 1 }
      - uses: actions/upload-artifact@v4
        with: {name: C-Cut-windows, path: dist/C-Cut-Setup.exe}
