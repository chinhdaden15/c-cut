# Kiểm thử ĐẦU-CUỐI mọi skill (packaging/e2e.py) trên Windows + macOS — chạy tay hoặc khi đẩy nhánh ci/**.
# Windows chạy với bảng mã mặc định (không ép UTF-8) giống máy người dùng.
name: e2e
on:
  workflow_dispatch:
  push:
    branches: ["ci/**"]
jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      CCUT_ASR_MODEL: small
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: ffmpeg (Windows — giống bản build)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build\ffmpeg | Out-Null
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile build\ff.zip
          Expand-Archive build\ff.zip build\ffx -Force
          Get-ChildItem build\ffx -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination build\ffmpeg
          "$PWD\build\ffmpeg" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: ffmpeg (macOS — giống bản build)
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/ffmpeg && cd build/ffmpeg
          for b in ffmpeg ffprobe; do
            curl -fsSL -o $b.zip "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/$b.zip"
            unzip -o $b.zip && rm $b.zip && chmod +x $b
          done
          echo "$PWD" >> $GITHUB_PATH
      - run: pip install -r packaging/requirements-build.txt
      - name: cài HyperFrames đúng bản ghim (npm ci) + trình duyệt render
        run: python -m thagent.hyper install
      - name: e2e (Windows — UTF-8 như trình khởi động của app; bản đóng gói thật kiểm ở workflow build)
        if: runner.os == 'Windows'
        env: {PYTHONUTF8: "1"}
        run: python packaging/e2e.py e2e_work --only common,hyper,review
      - name: e2e (macOS)
        if: runner.os == 'macOS'
        run: python packaging/e2e.py e2e_work --only common,hyper,review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.os }}
          path: |
            e2e_work/e2e_report.json
            e2e_work/**/versions/**/*.mp4
            e2e_work/**/versions/**/qa_*.json
            e2e_work/projects/*/renders/**/*.mp4
            e2e_work/hyper/*.mp4
          if-no-files-found: ignore
